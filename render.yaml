# ============================================================
# GameWatch Render Infrastructure-As-Code ($0 / Month Free Tier)
# ============================================================
services:
  - type: web
    name: gamewatch-server
    env: docker
    plan: free
    region: frankfurt # Low ping to East Africa (Addis Ababa)
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: OPENCV_FFMPEG_CAPTURE_OPTIONS
        value: "rtsp_transport;tcp|fflags;nobuffer|max_delay;0"
      # Cloudflare D1 Permanent Cloud Database ($0/mo Forever)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

